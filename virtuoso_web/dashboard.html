<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtuoso — Agent Console</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #fafafa;
      --surface-elevated: #ffffff;
      --border: #e8e4e1;
      --border-accent: #f0c4b0;
      --text: #1a1a1a;
      --text-secondary: #5c534f;
      --text-muted: #8a817c;
      --accent: #e85d04;
      --accent-hover: #c44200;
      --accent-soft: #fff4ee;
      --accent-muted: #fce8dc;
      --danger: #c62828;
      --danger-soft: #fef2f2;
      --shadow-sm: 0 1px 2px rgba(26, 26, 26, 0.04);
      --shadow-md: 0 4px 12px rgba(232, 93, 4, 0.08);
      --radius: 10px;
      --radius-lg: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1.75rem;
      background: var(--surface-elevated);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }
    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: contain;
      border: 1px solid var(--border-accent);
      background: #fff;
      padding: 2px;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .brand .tagline {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 1px;
    }
    .header-meta {
      text-align: right;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .header-meta .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      margin-right: 6px;
      vertical-align: middle;
    }
    .header-meta .status-dot.on { background: #2e7d32; }
    .header-meta .status-dot.off { background: var(--accent); }
    main {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: calc(100vh - 65px);
    }
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.25rem;
      overflow-y: auto;
    }
    .panel-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin: 0 0 0.65rem;
    }
    .card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .card.accent-top { border-top: 3px solid var(--accent); }
    .status-row {
      display: flex;
      justify-content: space-between;
      padding: 0.35rem 0;
      font-size: 0.82rem;
      border-bottom: 1px solid #f0eeec;
    }
    .status-row:last-child { border-bottom: none; }
    .status-row span:first-child { color: var(--text-muted); }
    .status-row strong { color: var(--text); font-weight: 600; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge.ok { background: var(--accent-soft); color: var(--accent-hover); }
    .badge.warn { background: var(--danger-soft); color: var(--danger); }
    label.field-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      background: #fff;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-muted);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger {
      background: #fff;
      color: var(--danger);
      border-color: #f5c2c2;
    }
    .btn-danger:hover { background: var(--danger-soft); }
    .btn-block { width: 100%; margin-top: 0.5rem; }
    .nav-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.35rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.12s;
    }
    .nav-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-hover);
    }
    .workspace {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 65px);
      background: var(--bg);
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
    }
    .msg {
      max-width: 820px;
      margin-bottom: 1rem;
      padding: 1rem 1.15rem;
      border-radius: var(--radius-lg);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.9rem;
    }
    .msg.user {
      margin-left: auto;
      background: var(--accent-soft);
      border: 1px solid var(--border-accent);
      border-right: 3px solid var(--accent);
    }
    .msg.assistant {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
    }
    .msg.system {
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 0.35rem 0;
      border: none;
    }
    .msg.error {
      background: var(--danger-soft);
      border: 1px solid #f5c2c2;
      border-left: 3px solid var(--danger);
      color: var(--danger);
    }
    .composer {
      padding: 1rem 1.75rem 1.25rem;
      background: var(--surface-elevated);
      border-top: 1px solid var(--border);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.03);
    }
    .composer-toolbar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
      align-items: center;
    }
    .composer-toolbar select {
      padding: 0.45rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      font-size: 0.85rem;
      background: #fff;
      color: var(--text);
    }
    .composer-row {
      display: flex;
      gap: 0.65rem;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      min-height: 76px;
      max-height: 200px;
      resize: vertical;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font: inherit;
      line-height: 1.45;
      background: #fff;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-muted);
    }
    .composer-actions {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .composer-actions .btn { min-width: 96px; }
    #stop-btn { display: none; }
    #stop-btn.visible { display: inline-flex; }
    a.link { color: var(--accent); text-decoration: none; font-size: 0.8rem; }
    a.link:hover { text-decoration: underline; }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/assets/logo.ico" alt="Virtuoso" onerror="this.src='/assets/logo.png'" />
      <div>
        <h1>Virtuoso</h1>
        <div class="tagline">Agent Console · v2.2</div>
      </div>
    </div>
    <div class="header-meta">
      <div><span class="status-dot" id="status-dot"></span><span id="header-status">Connecting…</span></div>
    </div>
  </header>
  <main>
    <aside>
      <p class="panel-title">Configuration</p>
      <div class="card accent-top">
        <label class="field-label" for="api-key">Gemini API Key</label>
        <input type="password" id="api-key" placeholder="Paste your API key" autocomplete="off" />
        <button type="button" class="btn btn-primary btn-block" id="save-key-btn">Save &amp; Connect</button>
        <p style="margin:0.6rem 0 0"><a class="link" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Get a free API key →</a></p>
      </div>

      <p class="panel-title">System Status</p>
      <div class="card" id="status-card">
        <div class="status-row"><span>Connection</span><span id="conn-badge" class="badge warn">—</span></div>
        <div class="status-row"><span>Model</span><strong id="stat-model">—</strong></div>
        <div class="status-row"><span>Backend</span><strong id="stat-backend">—</strong></div>
        <div class="status-row"><span>Profile</span><strong id="stat-profile">—</strong></div>
      </div>

      <p class="panel-title">Workflow</p>
      <div class="card" style="padding:0.65rem">
        <button type="button" class="nav-btn" data-mode="chat">Chat</button>
        <button type="button" class="nav-btn" data-mode="build">Build &amp; Save Files</button>
        <button type="button" class="nav-btn" data-mode="plan">Plan</button>
      </div>

      <p class="panel-title">Presets</p>
      <div class="card" style="padding:0.65rem">
        <button type="button" class="nav-btn" data-preset="fix">Fix Code</button>
        <button type="button" class="nav-btn" data-preset="explain">Explain</button>
        <button type="button" class="nav-btn" data-preset="test">Write Tests</button>
        <button type="button" class="nav-btn" data-preset="refactor">Refactor</button>
        <button type="button" class="nav-btn" data-preset="review">Review</button>
      </div>
    </aside>

    <section class="workspace">
      <div id="messages"></div>
      <form class="composer" id="composer">
        <div class="composer-toolbar">
          <select id="mode" aria-label="Mode">
            <option value="chat">Chat</option>
            <option value="build">Build</option>
            <option value="plan">Plan</option>
            <option value="fix">Fix</option>
            <option value="explain">Explain</option>
            <option value="test">Test</option>
            <option value="refactor">Refactor</option>
            <option value="review">Review</option>
          </select>
        </div>
        <div class="composer-row">
          <textarea id="prompt" placeholder="Describe your task…&#10;Example: Build a fraction solver on my desktop titled ai test math" required></textarea>
          <div class="composer-actions">
            <button class="btn btn-primary" type="submit" id="send-btn">Send</button>
            <button class="btn btn-danger" type="button" id="stop-btn">Stop</button>
          </div>
        </div>
      </form>
    </section>
  </main>
  <script>
    const messages = document.getElementById("messages");
    const promptEl = document.getElementById("prompt");
    const modeEl = document.getElementById("mode");
    const sendBtn = document.getElementById("send-btn");
    const stopBtn = document.getElementById("stop-btn");
    const statusCard = document.getElementById("status-card");
    const headerStatus = document.getElementById("header-status");
    const statusDot = document.getElementById("status-dot");
    const connBadge = document.getElementById("conn-badge");
    const apiKeyEl = document.getElementById("api-key");
    const saveKeyBtn = document.getElementById("save-key-btn");

    let abortController = null;
    let busy = false;

    function setBusy(running) {
      busy = running;
      sendBtn.disabled = running || sendBtn.dataset.disconnected === "1";
      stopBtn.classList.toggle("visible", running);
    }

    function addMsg(role, text, extraClass = "") {
      const div = document.createElement("div");
      div.className = `msg ${role} ${extraClass}`.trim();
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function refreshStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        const ok = data.connected;
        statusDot.className = "status-dot " + (ok ? "on" : "off");
        headerStatus.textContent = `${ok ? "Connected" : "Setup required"} · ${data.backend}`;
        connBadge.className = "badge " + (ok ? "ok" : "warn");
        connBadge.textContent = ok ? "Online" : "Offline";
        document.getElementById("stat-model").textContent = data.model || "—";
        document.getElementById("stat-backend").textContent = data.backend || "—";
        document.getElementById("stat-profile").textContent = data.profile || "—";
        sendBtn.dataset.disconnected = ok ? "0" : "1";
        if (!busy) sendBtn.disabled = !ok;
      } catch (e) {
        connBadge.textContent = "Error";
      }
    }

    saveKeyBtn.addEventListener("click", async () => {
      const key = apiKeyEl.value.trim();
      if (!key) { addMsg("system", "Enter your API key first.", "error"); return; }
      saveKeyBtn.disabled = true;
      try {
        const res = await fetch("/api/setup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ provider: "gemini", api_key: key }),
        });
        const data = await res.json();
        if (!res.ok) { addMsg("assistant", data.error || "Setup failed", "error"); return; }
        apiKeyEl.value = "";
        addMsg("system", "Connected successfully. You can now send requests.");
        await refreshStatus();
      } catch (err) {
        addMsg("assistant", String(err), "error");
      } finally {
        saveKeyBtn.disabled = false;
      }
    });

    stopBtn.addEventListener("click", async () => {
      if (abortController) abortController.abort();
      try { await fetch("/api/cancel", { method: "POST" }); } catch (_) {}
      addMsg("system", "Stopped. Partial results may still appear.");
      setBusy(false);
    });

    document.querySelectorAll("[data-mode]").forEach(btn => {
      btn.addEventListener("click", () => { modeEl.value = btn.dataset.mode; promptEl.focus(); });
    });
    document.querySelectorAll("[data-preset]").forEach(btn => {
      btn.addEventListener("click", () => { modeEl.value = btn.dataset.preset; promptEl.focus(); });
    });

    document.getElementById("composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const prompt = promptEl.value.trim();
      if (!prompt || busy) return;
      const mode = modeEl.value;
      addMsg("user", prompt);
      promptEl.value = "";
      abortController = new AbortController();
      setBusy(true);
      const thinking = addMsg("system", "Processing…");
      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, mode }),
          signal: abortController.signal,
        });
        const data = await res.json();
        thinking.remove();
        if (!res.ok) {
          addMsg("assistant", data.error || "Request failed", "error");
          return;
        }
        let text = data.text || "";
        if (data.saved_path) text += `\n\nSaved to: ${data.saved_path}`;
        if (data.cancelled) {
          addMsg("assistant", text, "error");
        } else {
          addMsg("assistant", text);
        }
      } catch (err) {
        thinking.remove();
        if (err.name === "AbortError") {
          addMsg("system", "Request cancelled.");
        } else {
          addMsg("assistant", String(err), "error");
        }
      } finally {
        abortController = null;
        setBusy(false);
        await refreshStatus();
        promptEl.focus();
      }
    });

    refreshStatus();
    setInterval(refreshStatus, 10000);
    addMsg("system", "Welcome to Virtuoso Agent Console. Configure your API key in the sidebar, then choose a workflow mode.");
  </script>
</body>
</html>
