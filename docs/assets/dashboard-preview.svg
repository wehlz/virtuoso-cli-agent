<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Virtuoso browser dashboard preview</title>
  <desc id="desc">A preview of the Virtuoso dashboard with setup, prompt controls, status, and generated code output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.45" stop-color="#115e59"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)"/>
  <g opacity="0.14">
    <circle cx="1080" cy="90" r="190" fill="#facc15"/>
    <circle cx="150" cy="620" r="230" fill="#38bdf8"/>
  </g>

  <rect x="72" y="54" width="1056" height="572" rx="18" fill="#e5e7eb" filter="url(#shadow)"/>
  <rect x="72" y="54" width="1056" height="52" rx="18" fill="#f8fafc"/>
  <circle cx="104" cy="80" r="7" fill="#ef4444"/>
  <circle cx="128" cy="80" r="7" fill="#f59e0b"/>
  <circle cx="152" cy="80" r="7" fill="#10b981"/>
  <rect x="190" y="69" width="720" height="22" rx="11" fill="#e2e8f0"/>
  <text x="212" y="85" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">http://127.0.0.1:8788</text>

  <rect x="96" y="130" width="1008" height="472" rx="14" fill="url(#panel)"/>
  <rect x="96" y="130" width="1008" height="72" rx="14" fill="#111827"/>
  <text x="126" y="173" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Virtuoso</text>
  <text x="270" y="173" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">AI coding agent for ordinary laptops</text>
  <rect x="944" y="152" width="128" height="28" rx="14" fill="#064e3b"/>
  <text x="974" y="171" fill="#bbf7d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Connected</text>

  <rect x="126" y="232" width="300" height="328" rx="10" fill="#1f2937"/>
  <text x="150" y="263" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Setup</text>
  <text x="150" y="294" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Provider</text>
  <rect x="150" y="308" width="238" height="36" rx="8" fill="#0f172a"/>
  <text x="168" y="331" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Gemini API Key</text>
  <text x="150" y="374" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Status</text>
  <rect x="150" y="390" width="238" height="78" rx="8" fill="#0f172a"/>
  <text x="168" y="418" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Backend: gemini-apikey</text>
  <text x="168" y="444" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Model: gemini-2.5-flash</text>
  <rect x="150" y="496" width="112" height="36" rx="8" fill="#2563eb"/>
  <text x="184" y="519" fill="#eff6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Save</text>

  <rect x="456" y="232" width="616" height="328" rx="10" fill="#020617"/>
  <text x="486" y="263" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Build</text>
  <rect x="486" y="292" width="556" height="72" rx="8" fill="#111827"/>
  <text x="508" y="322" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">make a Python todo app on my desktop titled todo</text>
  <rect x="486" y="388" width="124" height="38" rx="8" fill="#0f766e"/>
  <text x="525" y="413" fill="#ccfbf1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Run</text>
  <rect x="628" y="388" width="124" height="38" rx="8" fill="#1e293b"/>
  <text x="666" y="413" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Plan</text>
  <rect x="486" y="452" width="556" height="78" rx="8" fill="#0f172a"/>
  <text x="508" y="480" fill="#93c5fd" font-family="Consolas, Monaco, monospace" font-size="14">Saved to: C:\Users\you\Desktop\todo.py</text>
  <text x="508" y="506" fill="#a7f3d0" font-family="Consolas, Monaco, monospace" font-size="14">Review Result: PASS</text>
</svg>
